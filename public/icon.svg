<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Sun & Aura Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Wheat Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Saffron Crest Gradient -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.4" />

  <!-- Inner Concentric Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.3" />

  <!-- Sun Rays & Glow -->
  <circle cx="256" cy="210" r="140" fill="url(#sunGlow)" />
  <circle cx="256" cy="205" r="55" fill="#fef08a" opacity="0.95" filter="url(#goldGlow)" />

  <!-- Rolling Green Fields (Hills) -->
  <path d="M 40 400 Q 140 330 256 360 Q 370 390 472 340 L 472 430 Q 472 480 420 480 L 92 480 Q 40 480 40 430 Z" fill="#047857" opacity="0.9" />
  <path d="M 40 425 Q 170 365 285 390 Q 390 415 472 375 L 472 440 Q 472 480 420 480 L 92 480 Q 40 480 40 440 Z" fill="#065f46" />

  <!-- Saffron Temple / Panchayat Kalash Crest Silhouette in Sun -->
  <g transform="translate(256, 200) scale(0.85)">
    <!-- Kalash Base & Dome -->
    <path d="M -24 35 L 24 35 L 18 10 L -18 10 Z" fill="#f59e0b" />
    <path d="M -30 10 Q 0 -15 30 10 L 25 35 Q 0 45 -25 35 Z" fill="#fbbf24" />
    <!-- Coconut & Mango Leaves on Kalash -->
    <ellipse cx="0" cy="-6" rx="14" ry="16" fill="#f97316" />
    <path d="M -16 0 C -28 -12 -18 -26 0 -28 C 18 -26 28 -12 16 0 Z" fill="#10b981" />
    <!-- Spire / Dhwaja -->
    <path d="M 0 -28 L 0 -50" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    <path d="M 0 -50 L 18 -42 L 0 -34 Z" fill="#f97316" />
  </g>

  <!-- Left Golden Wheat Sheaf (कनक बाली) -->
  <g filter="url(#goldGlow)">
    <!-- Stem -->
    <path d="M 120 420 Q 140 310 200 170" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Grains -->
    <ellipse cx="140" cy="350" rx="14" ry="7" transform="rotate(-35 140 350)" fill="url(#goldGrad)" />
    <ellipse cx="162" cy="320" rx="15" ry="8" transform="rotate(35 162 320)" fill="url(#goldGrad)" />
    <ellipse cx="150" cy="285" rx="15" ry="8" transform="rotate(-30 150 285)" fill="url(#goldGrad)" />
    <ellipse cx="178" cy="255" rx="16" ry="8" transform="rotate(40 178 255)" fill="url(#goldGrad)" />
    <ellipse cx="170" cy="220" rx="16" ry="8" transform="rotate(-25 170 220)" fill="url(#goldGrad)" />
    <ellipse cx="198" cy="195" rx="16" ry="8" transform="rotate(45 198 195)" fill="url(#goldGrad)" />
    <ellipse cx="192" cy="160" rx="16" ry="8" transform="rotate(-15 192 160)" fill="url(#goldGrad)" />
    <ellipse cx="206" cy="135" rx="14" ry="7" transform="rotate(20 206 135)" fill="url(#goldGrad)" />
    <ellipse cx="202" cy="115" rx="12" ry="6" transform="rotate(5 202 115)" fill="#fef08a" />
  </g>

  <!-- Right Golden Wheat Sheaf (कनक बाली) -->
  <g filter="url(#goldGlow)">
    <!-- Stem -->
    <path d="M 392 420 Q 372 310 312 170" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Grains -->
    <ellipse cx="372" cy="350" rx="14" ry="7" transform="rotate(35 372 350)" fill="url(#goldGrad)" />
    <ellipse cx="350" cy="320" rx="15" ry="8" transform="rotate(-35 350 320)" fill="url(#goldGrad)" />
    <ellipse cx="362" cy="285" rx="15" ry="8" transform="rotate(30 362 285)" fill="url(#goldGrad)" />
    <ellipse cx="334" cy="255" rx="16" ry="8" transform="rotate(-40 334 255)" fill="url(#goldGrad)" />
    <ellipse cx="342" cy="220" rx="16" ry="8" transform="rotate(25 342 220)" fill="url(#goldGrad)" />
    <ellipse cx="314" cy="195" rx="16" ry="8" transform="rotate(-45 314 195)" fill="url(#goldGrad)" />
    <ellipse cx="320" cy="160" rx="16" ry="8" transform="rotate(15 320 160)" fill="url(#goldGrad)" />
    <ellipse cx="306" cy="135" rx="14" ry="7" transform="rotate(-20 306 135)" fill="url(#goldGrad)" />
    <ellipse cx="310" cy="115" rx="12" ry="6" transform="rotate(-5 310 115)" fill="#fef08a" />
  </g>

  <!-- Bottom Ribbon / Banner -->
  <g transform="translate(256, 420)">
    <path d="M -160 10 L -120 -15 L 120 -15 L 160 10 L 140 35 L 0 28 L -140 35 Z" fill="#064e3b" stroke="#f59e0b" stroke-width="2.5" />
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#fef08a" text-anchor="middle" letter-spacing="3">MOTI NAGAR</text>
  </g>

  <!-- Star accents -->
  <polygon points="256,48 261,60 274,60 263,68 267,80 256,72 245,80 249,68 238,60 251,60" fill="#fbbf24" filter="url(#goldGlow)" />
  <polygon points="110,120 113,128 122,128 115,134 118,142 110,137 102,142 105,134 98,128 107,128" fill="#fbbf24" opacity="0.8" />
  <polygon points="402,120 405,128 414,128 407,134 410,142 402,137 394,142 397,134 390,128 399,128" fill="#fbbf24" opacity="0.8" />
</svg>
